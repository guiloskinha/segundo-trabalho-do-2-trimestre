    <h1>PearHarbor</h1>
    <p>Foi uma ofensiva surpresa da Marinha Inperial contra a base naval</p>
    <p>dos Estados Unidos em Honolulu, no Havai. Ocorreu na manha de 7 de dezembro de 1941</p>
    <p>e causou a morte de cerca de 2.500 norte-americanos, alem de destruir grande parte</p>
    <p>da frota americana no Pacifico.</p>
